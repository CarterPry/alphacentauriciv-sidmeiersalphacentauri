  <script>
    // Preserve bookmarks into the former archive home.
    function openArchiveBookmark() {
      if (['#play', '#research', '#assets', '#evidence'].includes(location.hash)) {
        location.replace('/library.html' + location.search + location.hash);
      }
    }
    openArchiveBookmark();
    window.addEventListener('hashchange', openArchiveBookmark);
  </script>
</head>

    <a class="edition-choice" href="/play.html?edition=alien-crossfire"><img src="/game-data/images/xopeninga.png" alt="" width="1024" height="768"><span>Expansion pack</span></a>
